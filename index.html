<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スマート住所録</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@600;800&display=swap');
        
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .font-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(75, 85, 99, 0.5);
        }

        /* ライトモード用包括的スタイルオーバーライド */
        html.theme-light body {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        html.theme-light header,
        html.theme-light nav {
            background-color: rgba(255, 255, 255, 0.95) !important;
            border-color: #e2e8f0 !important;
        }
        html.theme-light header h1,
        html.theme-light header p,
        html.theme-light .text-white,
        html.theme-light .text-slate-100,
        html.theme-light .text-slate-200,
        html.theme-light .text-slate-300 {
            color: #0f172a !important;
        }
        html.theme-light .text-slate-400 {
            color: #64748b !important;
        }
        html.theme-light .bg-slate-900,
        html.theme-light .bg-slate-800,
        html.theme-light .bg-slate-950 {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        html.theme-light input,
        html.theme-light textarea,
        html.theme-light select {
            background-color: #ffffff !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
        }
        html.theme-light input::placeholder,
        html.theme-light textarea::placeholder {
            color: #94a3b8 !important;
        }
        html.theme-light .bg-slate-700 {
            background-color: #f1f5f9 !important;
            color: #1e293b !important;
            border-color: #cbd5e1 !important;
        }
        html.theme-light .bg-blue-950\/60,
        html.theme-light .bg-blue-950\/80,
        html.theme-light .bg-blue-900\/50 {
            background-color: #eff6ff !important;
            border-color: #bfdbfe !important;
        }
        html.theme-light .bg-blue-950\/60 .text-blue-300 {
            color: #1d4ed8 !important;
        }
        html.theme-light .bg-amber-950\/80,
        html.theme-light .bg-amber-950 {
            background-color: #fefce8 !important;
            border-color: #fef08a !important;
        }
        html.theme-light table thead {
            background-color: #f8fafc !important;
            border-color: #cbd5e1 !important;
        }
        html.theme-light table tbody tr:hover {
            background-color: #f1f5f9 !important;
        }
        html.theme-light .sticky-header-bg {
            background-color: rgba(248, 250, 252, 0.95) !important;
            border-color: #e2e8f0 !important;
        }
        html.dark .sticky-header-bg {
            background-color: rgba(15, 23, 42, 0.95) !important;
            border-color: #334155 !important;
        }

        /* 印刷スタイル定義 */
        @media print {
            body * {
                visibility: hidden;
            }
            #printTargetArea, #printTargetArea * {
                visibility: visible;
            }
            #printTargetArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background: white !important;
                color: black !important;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-28 sm:pb-12 selection:bg-blue-500 selection:text-white">

    <!-- ヘッダー -->
    <header class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700/80 sticky top-0 z-30 px-3 sm:px-4 py-2.5 shadow-md">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-md shadow-blue-500/30">
                    <i class="fa-solid fa-address-book"></i>
                </div>
                <div>
                    <h1 class="text-sm sm:text-base font-bold text-slate-100 leading-tight">スマート住所録</h1>
                    <p class="text-[9px] sm:text-[10px] text-slate-400">参照・拡大・印刷対応</p>
                </div>
            </div>

            <!-- ヘッダーアクション (PC・タブレット表示、スマホ時は下部ナビに統合) -->
            <div class="hidden sm:flex items-center space-x-2">
                <!-- テーマ迅速切り替えボタン -->
                <button onclick="toggleThemeQuick()" title="テーマ切替" class="px-2 py-1 bg-slate-700/80 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium transition cursor-pointer border border-slate-600 flex items-center space-x-1">
                    <i id="themeToggleIcon" class="fa-solid fa-sun text-amber-400"></i>
                    <span id="themeToggleText">ライト</span>
                </button>

                <!-- 表示設定 -->
                <button onclick="openSettingsModal()" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium transition cursor-pointer border border-slate-600 flex items-center space-x-1 shadow-sm">
                    <i class="fa-solid fa-gear text-amber-400"></i>
                    <span>表示設定</span>
                </button>

                <!-- データ管理/バックアップ -->
                <button onclick="openDataModal()" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium transition cursor-pointer border border-slate-600 flex items-center space-x-1 shadow-sm">
                    <i class="fa-solid fa-database text-cyan-400"></i>
                    <span>保存・復元</span>
                </button>

                <!-- 新規登録 -->
                <button onclick="openModal()" class="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-xs transition cursor-pointer shadow-md shadow-blue-600/30 flex items-center space-x-1">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>新規登録</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 検索・フィルター・コントロールエリア (Sticky) -->
    <section class="sticky top-[49px] sm:top-[53px] z-20 sticky-header-bg border-b border-slate-800 shadow-md backdrop-blur-md px-3 py-2">
        <div class="max-w-6xl mx-auto space-y-1.5">
            <div class="flex flex-col sm:flex-row gap-1.5">
                <!-- 検索窓 -->
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" oninput="applyFilters()" placeholder="名前・住所・メモで検索..."
                           class="w-full pl-8 pr-7 py-1.5 bg-slate-800/90 border border-slate-700/80 rounded-lg text-xs text-slate-100 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    <button onclick="clearSearch()" id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 text-xs">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </button>
                </div>

                <div class="flex items-center justify-between sm:justify-start space-x-2">
                    <!-- 並び替え -->
                    <select id="sortSelect" onchange="applyFilters()" class="bg-slate-800/90 border border-slate-700/80 text-[11px] sm:text-xs text-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:border-blue-500 cursor-pointer">
                        <option value="custom">任意パターン順（登録順）</option>
                        <option value="kanaAsc">五十音順 (ア→ン)</option>
                        <option value="kanaDesc">五十音順 (ン→ア)</option>
                    </select>

                    <!-- 表示モード切替（カード / 一覧） -->
                    <div class="flex bg-slate-800 p-0.5 rounded-lg border border-slate-700/80">
                        <button id="viewCardBtn" onclick="switchViewMode('card')" class="px-2 py-1 text-[11px] rounded transition font-medium cursor-pointer flex items-center space-x-1 bg-blue-600 text-white">
                            <i class="fa-solid fa-address-card"></i>
                            <span class="hidden sm:inline">カード</span>
                        </button>
                        <button id="viewTableBtn" onclick="switchViewMode('table')" class="px-2 py-1 text-[11px] rounded transition font-medium cursor-pointer flex items-center space-x-1 text-slate-400 hover:text-slate-200">
                            <i class="fa-solid fa-list"></i>
                            <span class="hidden sm:inline">一覧</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 50音クイックインデックスバー (コンパクト化) -->
            <div id="kanaIndexContainer" class="flex items-center space-x-1 overflow-x-auto text-[10px] sm:text-[11px] no-scrollbar border-t border-b border-slate-700/40 py-1">
                <!-- JSで動的生成 -->
            </div>

            <!-- タグフィルター (コンパクト化) -->
            <div id="tagFilterContainer" class="flex items-center space-x-1 overflow-x-auto text-[10px] sm:text-xs no-scrollbar">
                <!-- JSで動的生成 -->
            </div>
        </div>
    </section>

    <!-- メインコンテンツ -->
    <main class="max-w-6xl mx-auto px-3 sm:px-4 pt-3">
        <!-- ダブルクリック動作ガイド & 件数表示 -->
        <div class="flex items-center justify-between mb-2 text-[11px] text-slate-400 px-0.5">
            <span id="dblClickGuideText" class="flex items-center">
                <i class="fa-solid fa-hand-pointer mr-1 text-blue-400"></i>
                カードをダブルクリックで特大表示
            </span>
            <span id="contactCount" class="font-medium text-slate-300">0 件</span>
        </div>

        <!-- 連絡先リスト（カード表示ビュー） -->
        <div id="cardViewContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-3">
            <!-- JSで動的生成 -->
        </div>

        <!-- 連絡先リスト（テーブル一覧表示ビュー） -->
        <div id="tableViewContainer" class="hidden overflow-x-auto bg-slate-800 rounded-xl border border-slate-700/80 shadow-md">
            <table class="w-full text-left text-xs text-slate-300">
                <thead class="bg-slate-900/90 text-slate-400 uppercase font-bold border-b border-slate-700">
                    <tr>
                        <th scope="col" class="py-2 px-2 w-16 text-center">操作</th>
                        <th scope="col" class="py-2 px-2 w-12 text-center">順序</th>
                        <th scope="col" class="py-2 px-3">お名前 / 住所 / 主要連絡先</th>
                    </tr>
                </thead>
                <tbody id="tableTbody" class="divide-y divide-slate-700/50">
                    <!-- JSで動的生成 -->
                </tbody>
            </table>
        </div>

        <!-- 空の状態メッセージ -->
        <div id="emptyState" class="hidden text-center py-12 px-4">
            <div class="w-12 h-12 bg-slate-800 rounded-xl flex items-center justify-center mx-auto mb-3 border border-slate-700 text-slate-500">
                <i class="fa-solid fa-address-book text-xl"></i>
            </div>
            <h3 class="text-xs font-bold text-slate-300 mb-1">連絡先が見つかりません</h3>
            <p class="text-[11px] text-slate-400 mb-3">新規登録するか、検索条件・フィルターを解除してください。</p>
            <button onclick="openModal()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-bold transition">
                <i class="fa-solid fa-plus mr-1"></i>新規登録する
            </button>
        </div>
    </main>

    <!-- モーダル: 登録・編集 -->
    <div id="contactModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-3">
        <div class="bg-slate-800 rounded-xl max-w-lg w-full p-4 shadow-2xl border border-slate-700 max-h-[90vh] flex flex-col text-xs">
            <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-700 shrink-0">
                <h3 id="modalTitle" class="text-sm font-bold text-slate-100 flex items-center">
                    <i class="fa-solid fa-user-pen mr-2 text-blue-400"></i>連絡先の登録
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 cursor-pointer p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <form id="contactForm" onsubmit="saveContact(event)" class="flex flex-col flex-1 overflow-hidden">
                <input type="hidden" id="contactId">

                <!-- 1. 固定表示エリア -->
                <div id="fixedZoneContainer" class="space-y-2 bg-blue-950/40 p-2.5 rounded-lg border border-blue-900/60 shrink-0 mb-2">
                    <div class="text-[10px] font-bold text-blue-400 flex items-center mb-0.5">
                        <i class="fa-solid fa-thumbtack mr-1"></i>固定表示エリア（必須項目）
                    </div>
                </div>

                <!-- 2. スクロール表示エリア -->
                <div class="overflow-y-auto pr-1 space-y-2.5 flex-1">
                    <div id="scrollZoneContainer" class="space-y-2.5"></div>

                    <!-- 3. 詳細表示エリア -->
                    <div id="foldZoneWrapper" class="pt-2 border-t border-slate-700/60">
                        <button type="button" onclick="toggleAccordion()" class="w-full py-1.5 px-2.5 bg-slate-900/80 hover:bg-slate-900 text-slate-300 rounded-lg border border-slate-700 flex justify-between items-center transition font-medium text-xs">
                            <span class="flex items-center">
                                <i class="fa-solid fa-sliders text-indigo-400 mr-1.5"></i>詳細項目を入力 (折りたたみ)
                            </span>
                            <i id="accordionIcon" class="fa-solid fa-chevron-down transition-transform duration-200 text-xs text-slate-400"></i>
                        </button>

                        <div id="foldZoneContainer" class="hidden space-y-2.5 pt-2 text-xs"></div>
                    </div>
                </div>

                <div class="pt-3 flex justify-end space-x-2 border-t border-slate-700/80 shrink-0 mt-2 text-xs">
                    <button type="button" onclick="closeModal()" class="px-3.5 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg font-bold cursor-pointer">
                        キャンセル
                    </button>
                    <button type="submit" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold cursor-pointer shadow-md">
                        保存する
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- DOMフィールド要素用の非表示バッファープール -->
    <div id="fieldsPool" class="hidden">
        <!-- お名前（姓・名） -->
        <div id="fieldName" class="grid grid-cols-2 gap-2 text-xs">
            <div>
                <label class="block font-bold text-slate-300 mb-1" id="lblLastName">姓 <span class="text-rose-400">*</span></label>
                <input type="text" id="inputLastName" placeholder="山田" class="w-full p-1.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block font-bold text-slate-300 mb-1" id="lblFirstName">名 <span class="text-rose-400">*</span></label>
                <input type="text" id="inputFirstName" placeholder="太郎" class="w-full p-1.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
            </div>
        </div>

        <!-- フリガナ（セイ・メイ） -->
        <div id="fieldFurigana" class="grid grid-cols-2 gap-2 text-xs">
            <div>
                <label class="block font-bold text-slate-300 mb-1" id="lblLastFurigana">セイ</label>
                <input type="text" id="inputLastFurigana" placeholder="ヤマダ" class="w-full p-1.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block font-bold text-slate-300 mb-1" id="lblFirstFurigana">メイ</label>
                <input type="text" id="inputFirstFurigana" placeholder="タロウ" class="w-full p-1.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
            </div>
        </div>

        <!-- 郵便番号・住所 -->
        <div id="fieldAddress" class="space-y-1.5 text-xs">
            <div>
                <label class="block font-bold text-slate-300 mb-1" id="lblPostal">郵便番号 <span class="text-rose-400">*</span></label>
                <div class="flex space-x-1.5">
                    <input type="text" id="inputPostal" placeholder="100-0001" class="flex-1 p-1.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
                    <button type="button" onclick="searchAddress()" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg whitespace-nowrap cursor-pointer text-xs">
                        住所検索
                    </button>
                </div>
                <span id="zipStatus" class="text-[10px] text-slate-400 mt-0.5 block"></span>
            </div>
            <div>
                <label class="block font-bold text-slate-300 mb-1" id="lblAddress">住所 <span class="text-rose-400">*</span></label>
                <textarea id="inputAddress" rows="2" placeholder="東京都千代田区千代田1-1" class="w-full p-1.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 resize-none"></textarea>
            </div>
        </div>

        <!-- 連名 -->
        <div id="fieldJointName" class="text-xs">
            <label class="block font-bold text-slate-300 mb-1" id="lblJointName">連名（ご家族など）</label>
            <input type="text" id="inputJointName" placeholder="花子（妻）, 翔太（長男）" class="w-full p-1.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
        </div>

        <!-- グループタグ -->
        <div id="fieldTags" class="text-xs">
            <label class="block font-bold text-slate-300 mb-1" id="lblTags">グループタグ</label>
            <div class="space-y-1">
                <div id="modalTagsBadgeList" class="flex flex-wrap gap-1 mb-1 min-h-[24px] p-1 bg-slate-900/60 rounded-lg border border-slate-700/50"></div>
                <div class="flex space-x-1.5">
                    <input type="text" id="inputTags" list="tagCandidateList" placeholder="例: 親戚, 年賀状" class="flex-1 p-1.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
                    <button type="button" onclick="addTagFromInput()" class="px-2.5 py-1.5 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-lg whitespace-nowrap cursor-pointer">
                        追加
                    </button>
                </div>
                <datalist id="tagCandidateList"></datalist>
            </div>
        </div>

        <!-- やり取り記録タグ -->
        <div id="fieldGiftNotes" class="text-xs">
            <label class="block font-bold text-slate-300 mb-1" id="lblGiftNotes">やり取り記録タグ</label>
            <div class="space-y-1">
                <div id="modalGiftNotesBadgeList" class="flex flex-wrap gap-1 mb-1 min-h-[24px] p-1 bg-slate-900/60 rounded-lg border border-slate-700/50"></div>
                <div class="flex space-x-1.5">
                    <input type="text" id="inputGiftNotes" list="giftCandidateList" placeholder="例: 2026年賀状送付済" class="flex-1 p-1.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
                    <button type="button" onclick="addGiftNoteFromInput()" class="px-2.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg whitespace-nowrap cursor-pointer">
                        追加
                    </button>
                </div>
                <datalist id="giftCandidateList"></datalist>
            </div>
        </div>

        <!-- 電話番号 -->
        <div id="fieldPhone" class="text-xs">
            <label class="block font-bold text-slate-300 mb-1" id="lblPhone">電話番号</label>
            <input type="tel" id="inputPhone" placeholder="090-1234-5678" class="w-full p-1.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
        </div>

        <!-- 会社名/所属 -->
        <div id="fieldCompany" class="text-xs">
            <label class="block font-bold text-slate-300 mb-1" id="lblCompany">会社名 / 所属</label>
            <input type="text" id="inputCompany" placeholder="株式会社〇〇" class="w-full p-1.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
        </div>

        <!-- 自由メモ -->
        <div id="fieldNotes" class="text-xs">
            <label class="block font-bold text-slate-300 mb-1" id="lblNotes">自由メモ</label>
            <textarea id="inputNotes" rows="2" placeholder="自由メモなど" class="w-full p-1.5 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 resize-none"></textarea>
        </div>
    </div>

    <!-- 特大表示モーダル -->
    <div id="zoomModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-950/90 backdrop-blur-md p-3 overflow-y-auto">
        <div class="bg-slate-900 rounded-2xl max-w-xl w-full p-4 sm:p-6 shadow-2xl border-2 border-amber-500/60 my-auto text-slate-100 relative">

    <!-- スマホ専用固定ボトムナビゲーション -->
    <nav class="sm:hidden fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur-md border-t border-slate-700 z-30 px-2 py-1.5">
        <div class="grid grid-cols-4 gap-1 text-center text-[10px]">
            <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="text-slate-400 hover:text-blue-400 py-0.5 cursor-pointer">

            <button onclick="openModal()" class="text-blue-400 font-bold py-0.5 cursor-pointer">

    <!-- トースト通知コンテナ -->
    <div id="toastContainer" class="fixed bottom-20 sm:bottom-6 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- アプリ機能スクリプト -->
    <script>
        let contacts = [];
        let deleteTargetId = null;
        let selectedFilterTag = 'ALL';
        let selectedKanaIndex = 'ALL';
        let currentViewMode = 'card';
        let currentAppTheme = 'dark';
        let printTargetId = null;

        let currentModalTags = [];
        let currentModalGiftNotes = [];

        let fieldSettings = [
            { id: 'name', elId: 'fieldName', zone: 'fixed', isRequired: true },
            { id: 'address', elId: 'fieldAddress', zone: 'fixed', isRequired: true },
            { id: 'phone', elId: 'fieldPhone', zone: 'scroll', isRequired: false },
            { id: 'tags', elId: 'fieldTags', zone: 'scroll', isRequired: false },
            { id: 'giftNotes', elId: 'fieldGiftNotes', zone: 'scroll', isRequired: false },
            { id: 'furigana', elId: 'fieldFurigana', zone: 'fold', isRequired: false },
            { id: 'jointName', elId: 'fieldJointName', zone: 'fold', isRequired: false },
            { id: 'company', elId: 'fieldCompany', zone: 'fold', isRequired: false },
            { id: 'notes', elId: 'fieldNotes', zone: 'fold', isRequired: false }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            loadContacts();
            renderKanaIndexBar();
            applyFilters();
        });

        function normalizeContactsData() {
            if (!Array.isArray(contacts)) return;
            contacts.forEach(c => {
                const postalVal = c.postal || c.zip || c.zipCode || c.postalCode || '';
                c.postal = postalVal;
                c.zip = postalVal;
                if (c.lastName === undefined) c.lastName = c.name || '';
                if (c.firstName === undefined) c.firstName = '';
                if (c.lastFurigana === undefined) c.lastFurigana = c.kana || '';
                if (c.firstFurigana === undefined) c.firstFurigana = '';
                if (c.address === undefined) c.address = '';
                if (!Array.isArray(c.tags)) c.tags = [];
                if (!Array.isArray(c.giftNotes)) c.giftNotes = [];
            });
        }

        function setAppTheme(theme) {
            currentAppTheme = theme;
            const html = document.documentElement;
            if (theme === 'light') {
                html.classList.remove('dark');
                html.classList.add('theme-light');
            } else {
                html.classList.add('dark');
                html.classList.remove('theme-light');
            }
        }

        function toggleThemeQuick() {
            const newTheme = currentAppTheme === 'dark' ? 'light' : 'dark';
            setAppTheme(newTheme);
        }

        function openSettingsModal() {
            document.getElementById('settingsModal')?.classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal')?.classList.add('hidden');
        }

        function loadContacts() {
            const data = localStorage.getItem('address_book_contacts_v6');
            if (data) {
                try {
                    contacts = JSON.parse(data);
                    normalizeContactsData();
                } catch(e) {
                    contacts = getSampleData();
                }
            } else {
                contacts = getSampleData();
                saveContacts();
            }
        }

        function saveContacts() {
            normalizeContactsData();
            localStorage.setItem('address_book_contacts_v6', JSON.stringify(contacts));
        }

        function getSampleData() {
            return [
                {
                    id: '1',
                    lastName: '山田',
                    firstName: '太郎',
                    lastFurigana: 'ヤマダ',
                    firstFurigana: 'タロウ',
                    postal: '100-0001',
                    zip: '100-0001',
                    address: '東京都千代田区千代田1-1',
                    jointName: '花子（妻）',
                    phone: '03-1234-5678',
                    company: 'サンプル株式会社',
                    tags: ['親戚', '年賀状'],
                    giftNotes: ['2026年賀状送付済'],
                    notes: '毎年お中元をいただく。',
                    createdAt: Date.now()
                }
            ];
        }

        function setupModalFormFields() {
            const pool = document.getElementById('fieldsPool');
            const fixedZone = document.getElementById('fixedZoneContainer');
            const scrollZone = document.getElementById('scrollZoneContainer');
            const foldZone = document.getElementById('foldZoneContainer');

            if (!pool || !fixedZone || !scrollZone || !foldZone) return;

            fieldSettings.forEach(field => {
                const el = document.getElementById(field.elId);
                if (!el) return;
                if (field.zone === 'fixed') fixedZone.appendChild(el);
                else if (field.zone === 'scroll') scrollZone.appendChild(el);
                else foldZone.appendChild(el);
            });
        }

        function openModal(id = null) {
            setupModalFormFields();

            const modal = document.getElementById('contactModal');
            const form = document.getElementById('contactForm');
            const title = document.getElementById('modalTitle');

            form.reset();
            currentModalTags = [];
            currentModalGiftNotes = [];

            if (id) {
                const contact = contacts.find(c => c.id === id);
                if (contact) {
                    title.innerHTML = `<i class="fa-solid fa-user-pen mr-2 text-blue-400"></i>連絡先の編集`;
                    document.getElementById('contactId').value = contact.id;
                    document.getElementById('inputLastName').value = contact.lastName || '';
                    document.getElementById('inputFirstName').value = contact.firstName || '';
                    document.getElementById('inputLastFurigana').value = contact.lastFurigana || '';
                    document.getElementById('inputFirstFurigana').value = contact.firstFurigana || '';
                    document.getElementById('inputPostal').value = contact.postal || '';
                    document.getElementById('inputAddress').value = contact.address || '';
                    document.getElementById('inputJointName').value = contact.jointName || '';
                    document.getElementById('inputPhone').value = contact.phone || '';
                    document.getElementById('inputCompany').value = contact.company || '';
                    document.getElementById('inputNotes').value = contact.notes || '';

                    currentModalTags = [...(contact.tags || [])];
                    currentModalGiftNotes = [...(contact.giftNotes || [])];
                }
            } else {
                title.innerHTML = `<i class="fa-solid fa-user-plus mr-2 text-blue-400"></i>新規連絡先の登録`;
                document.getElementById('contactId').value = '';
            }

            renderModalTagBadges();
            modal.classList.remove('hidden');
        }

        function closeModal() {
            const pool = document.getElementById('fieldsPool');
            fieldSettings.forEach(field => {
                const el = document.getElementById(field.elId);
                if (el && pool) pool.appendChild(el);
            });
            document.getElementById('contactModal')?.classList.add('hidden');
        }

        function renderModalTagBadges() {
            const tagsList = document.getElementById('modalTagsBadgeList');
            if (tagsList) {
                tagsList.innerHTML = currentModalTags.map((t, idx) => `
                    <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-pink-950/80 text-pink-300 border border-pink-700/60">
                        #${t}
                        <button type="button" onclick="removeModalTag(${idx})" class="ml-1 text-pink-400 cursor-pointer">✕</button>
                    </span>
                `).join('');
            }
        }

        function addTagFromInput() {
            const input = document.getElementById('inputTags');
            if (!input) return;
            const val = input.value.trim();
            if (val && !currentModalTags.includes(val)) {
                currentModalTags.push(val);
                input.value = '';
                renderModalTagBadges();
            }
        }

        function removeModalTag(idx) {
            currentModalTags.splice(idx, 1);
            renderModalTagBadges();
        }

        function addGiftNoteFromInput() {
            const input = document.getElementById('inputGiftNotes');
            if (!input) return;
            const val = input.value.trim();
            if (val && !currentModalGiftNotes.includes(val)) {
                currentModalGiftNotes.push(val);
                input.value = '';
                renderModalTagBadges();
            }
        }

        function toggleAccordion() {
            const content = document.getElementById('foldZoneContainer');
            const icon = document.getElementById('accordionIcon');
            if (content) {
                content.classList.toggle('hidden');
                if (icon) icon.classList.toggle('rotate-180');
            }
        }

        function saveContact(e) {
            e.preventDefault();

            const id = document.getElementById('contactId').value;
            const lastName = document.getElementById('inputLastName').value.trim();
            const firstName = document.getElementById('inputFirstName').value.trim();
            const postal = document.getElementById('inputPostal').value.trim();
            const address = document.getElementById('inputAddress').value.trim();

            if (!lastName || !firstName || !postal || !address) {
                showToast('必須項目を入力してください', 'error');
                return;
            }

            const contactData = {
                id: id || Date.now().toString(),
                lastName,
                firstName,
                lastFurigana: document.getElementById('inputLastFurigana').value.trim(),
                firstFurigana: document.getElementById('inputFirstFurigana').value.trim(),
                postal,
                zip: postal,
                address,
                jointName: document.getElementById('inputJointName').value.trim(),
                phone: document.getElementById('inputPhone').value.trim(),
                company: document.getElementById('inputCompany').value.trim(),
                tags: [...currentModalTags],
                giftNotes: [...currentModalGiftNotes],
                notes: document.getElementById('inputNotes').value.trim(),
                createdAt: Date.now()
            };

            if (id) {
                const index = contacts.findIndex(c => c.id === id);
                if (index !== -1) contacts[index] = contactData;
            } else {
                contacts.unshift(contactData);
            }

            saveContacts();
            closeModal();
            applyFilters();
            showToast('保存しました', 'success');
        }

        async function searchAddress() {
            const postalInput = document.getElementById('inputPostal');
            const statusEl = document.getElementById('zipStatus');
            if (!postalInput || !statusEl) return;

            let code = postalInput.value.replace(/[^\d]/g, '');
            if (code.length !== 7) {
                statusEl.textContent = '7桁の郵便番号を入力してください';
                return;
            }

            try {
                const res = await fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${code}`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    const r = data.results[0];
                    document.getElementById('inputAddress').value = `${r.address1}${r.address2}${r.address3}`;
                    statusEl.textContent = '住所を取得しました';
                }
            } catch(err) {
                statusEl.textContent = '検索エラー';
            }
        }

        function renderKanaIndexBar() {
            const container = document.getElementById('kanaIndexContainer');
            if (!container) return;

            const kanaList = ['ALL', 'ア', 'カ', 'サ', 'タ', 'ナ', 'ハ', 'マ', 'ヤ', 'ラ', 'ワ'];
            container.innerHTML = kanaList.map(k => `
                <button onclick="filterByKana('${k}')" class="px-2 py-0.5 rounded font-bold whitespace-nowrap transition ${selectedKanaIndex === k ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:text-white border border-slate-700'}">
                    ${k === 'ALL' ? 'すべて' : k + '行'}
                </button>
            `).join('');
        }

        function filterByKana(kana) {
            selectedKanaIndex = kana;
            renderKanaIndexBar();
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput')?.value.toLowerCase().trim() || '';

            let filtered = contacts.filter(item => {
                if (selectedFilterTag !== 'ALL') {
                    if (!(item.tags || []).includes(selectedFilterTag)) return false;
                }
                if (!query) return true;
                const matchName = `${item.lastName || ''}${item.firstName || ''}`.toLowerCase().includes(query);
                const matchAddr = (item.address || '').toLowerCase().includes(query);
                return matchName || matchAddr;
            });

            const countEl = document.getElementById('contactCount');
            if (countEl) countEl.textContent = `${filtered.length} 件`;

            const emptyEl = document.getElementById('emptyState');
            if (emptyEl) emptyEl.classList.toggle('hidden', filtered.length > 0);

            if (currentViewMode === 'card') {
                renderCardView(filtered);
            } else {
                renderTableView(filtered);
            }
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            if (input) input.value = '';
            applyFilters();
        }

        function switchViewMode(mode) {
            currentViewMode = mode;
            const cardContainer = document.getElementById('cardViewContainer');
            const tableContainer = document.getElementById('tableViewContainer');

            if (mode === 'card') {
                cardContainer.classList.remove('hidden');
                tableContainer.classList.add('hidden');
            } else {
                cardContainer.classList.add('hidden');
                tableContainer.classList.remove('hidden');
            }
            applyFilters();
        }

        function renderCardView(items) {
            const container = document.getElementById('cardViewContainer');
            if (!container) return;

            container.innerHTML = items.map(item => {
                return `
                    <div class="bg-slate-800 rounded-xl p-3 border border-slate-700/80 shadow-md space-y-2">
                        <!-- スマホ対応：ヘッダー（名前領域と操作ボタン群を2段に分離） -->
                        <div class="space-y-1.5 pb-2 border-b border-slate-700/60">
                            <!-- 1段目: 名前領域 -->
                            <div>
                                <div class="text-[10px] text-slate-400 font-bold">
                                    ${item.lastFurigana || ''} ${item.firstFurigana || ''}
                                </div>
                                <h3 class="text-base sm:text-lg font-black text-slate-100 flex items-center">
                                    ${item.lastName || ''} ${item.firstName || ''}
                                    <span class="text-xs text-slate-400 ml-1 font-normal">様</span>
                                </h3>
                            </div>

                            <!-- 2段目: 操作ボタン群 -->
                            <div class="flex items-center justify-end space-x-1 bg-slate-900/90 p-1 rounded-lg border border-slate-700/80 w-fit ml-auto">
                                <button onclick="openZoomModal('${item.id}')" title="拡大表示" class="px-2 py-1 bg-amber-500/20 text-amber-400 rounded hover:bg-amber-500/30 text-xs font-bold flex items-center space-x-1">
                                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                                    <span>拡大</span>
                                </button>
                                <button onclick="openModal('${item.id}')" title="編集" class="px-2 py-1 bg-blue-600/20 text-blue-400 rounded hover:bg-blue-600/30 text-xs font-bold flex items-center space-x-1">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                    <span>編集</span>
                                </button>
                                <button onclick="openDeleteModal('${item.id}')" title="削除" class="p-1 text-rose-400 hover:text-rose-300 text-xs">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 住所エリア -->
                        <div class="bg-blue-950/40 p-2.5 rounded-lg border border-blue-900/60 space-y-0.5">
                            <div class="text-[10px] font-mono font-bold text-blue-300">〒 ${item.postal || ''}</div>
                            <div class="text-xs font-bold text-slate-100 leading-snug">
                                ${item.address || ''}
                            </div>
                        </div>

                        <!-- 電話・グループ -->
                        <div class="text-xs space-y-1">
                            ${item.phone ? `<div class="text-emerald-400 font-bold"><i class="fa-solid fa-phone mr-1"></i>${item.phone}</div>` : ''}
                            ${item.notes ? `<div class="text-slate-300 bg-slate-900/60 p-1.5 rounded border border-slate-700/50 text-[11px]">${item.notes}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderTableView(items) {
            const tbody = document.getElementById('tableTbody');
            if (!tbody) return;

            tbody.innerHTML = items.map(item => `
                <tr class="hover:bg-slate-700/40">
                    <td class="py-2 px-2 text-center align-middle border-r border-slate-700/50">
                        <div class="flex justify-center space-x-1">
                            <button onclick="openZoomModal('${item.id}')" class="p-1 text-amber-400"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                            <button onclick="openModal('${item.id}')" class="p-1 text-blue-400"><i class="fa-solid fa-pen-to-square"></i></button>
                        </div>
                    </td>
                    <td class="py-2 px-1 text-center align-middle border-r border-slate-700/50 text-[10px] text-slate-400">-</td>
                    <td class="py-2 px-3 align-middle">
                        <div class="font-bold text-white text-xs">${item.lastName || ''} ${item.firstName || ''} 様</div>
                        <div class="text-[11px] text-slate-300">〒${item.postal || ''} ${item.address || ''}</div>
                    </td>
                </tr>
            `).join('');
        }

        function openZoomModal(id) {
            const item = contacts.find(c => c.id === id);
            if (!item) return;

            document.getElementById('zoomFurigana').textContent = `${item.lastFurigana || ''} ${item.firstFurigana || ''}`;
            document.getElementById('zoomName').textContent = `${item.lastName || ''} ${item.firstName || ''}`;
            document.getElementById('zoomPostal').textContent = `〒 ${item.postal || ''}`;
            document.getElementById('zoomAddress').textContent = item.address || '';

            const notesBox = document.getElementById('zoomNotesBox');
            if (item.notes) {
                document.getElementById('zoomNotes').textContent = item.notes;
                notesBox.classList.remove('hidden');
            } else {
                notesBox.classList.add('hidden');
            }

            document.getElementById('zoomModal').classList.remove('hidden');
        }

        function closeZoomModal() {
            document.getElementById('zoomModal').classList.add('hidden');
        }

        function openDataModal() {
            document.getElementById('dataModal').classList.remove('hidden');
        }

        function closeDataModal() {
            document.getElementById('dataModal').classList.add('hidden');
        }

        function exportJSON() {
            const jsonStr = JSON.stringify(contacts, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `address_book_backup.json`;
            a.click();
        }

        function exportCSV() {
            let csv = "\uFEFF姓,名,郵便番号,住所\n";
            contacts.forEach(c => {
                csv += `"${c.lastName || ''}","${c.firstName || ''}","${c.postal || ''}","${c.address || ''}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `address_book.csv`;
            a.click();
        }

        function importDataFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) {
                        contacts = imported;
                        saveContacts();
                        applyFilters();
                        closeDataModal();
                        showToast('データを復元しました', 'success');
                    }
                } catch(err) {
                    showToast('読み込み失敗', 'error');
                }
            };
            reader.readAsText(file);
        }

        function openDeleteModal(id) {
            deleteTargetId = id;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            deleteTargetId = null;
            document.getElementById('deleteModal').classList.add('hidden');
        }

        function confirmDelete() {
            if (deleteTargetId) {
                contacts = contacts.filter(c => c.id !== deleteTargetId);
                saveContacts();
                closeDeleteModal();
                applyFilters();
                showToast('削除しました', 'info');
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = 'bg-slate-800 border border-slate-700 text-white px-3 py-2 rounded-lg shadow-lg text-xs font-bold';
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => toast.remove(), 2500);
        }
    </script>
</body>
</html>
